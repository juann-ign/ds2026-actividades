<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="assets/logo_libreria.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Librería
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="libro.html">Libro</a>
                    </li>              
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section style="padding: 4rem 0;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-7">
                    <h2 style="font-family: var(--fuente-titulo); font-size: 2rem; margin-bottom: 0.5rem;">Contactanos</h2>
                    <p style="color: #888; margin-bottom: 2rem;">Respondemos en menos de 24 horas hábiles.</p>
                    <form id="formContacto" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label-libro">Nombre</label>
                            <input type="text" class="form-control form-control-libro" id="nombre" placeholder="Tu nombre" required>
                            <div class="invalid-feedback">Ingresá tu nombre.</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label-libro">Email</label>
                            <input type="email" class="form-control form-control-libro" id="email" placeholder="tu@email.com" required>
                            <div class="invalid-feedback">Ingresá un email válido.</div>
                        </div>

                        <div class="mb-3">
                            <label for="asunto" class="form-label-libro">Asunto</label>
                            <select class="form-select form-control-libro" id="asunto" required>
                                <option value="" disabled selected>Seleccioná...</option>
                                <option value="consulta">Consulta</option>
                                <option value="reclamo">Reclamo</option>
                                <option value="sugerencia">Sugerencia</option>
                            </select>
                            <div class="invalid-feedback">Seleccioná un asunto.</div>
                        </div>

                        <div class="mb-4">
                            <label for="mensaje" class="form-label-libro">Mensaje</label>
                            <textarea class="form-control form-control-libro" id="mensaje" rows="4" placeholder="Tu mensaje..." required></textarea>
                            <div class="invalid-feedback">Escribí tu mensaje.</div>
                        </div>

                        <button type="submit" class="btn btn-libreria w-100">Enviar</button>

                        <div id="mensajeExito" style="display:none; margin-top:1rem; padding:1rem; background:#d4edda; border-radius:6px; color:#155724;">
                            ✅ Mensaje enviado. Te respondemos pronto.
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        document.getElementById('formContacto').addEventListener('submit', function(e) {
        e.preventDefault();
        this.classList.add('was-validated');
        if (this.checkValidity()) {
            this.style.display = 'none';
            document.getElementById('mensajeExito').style.display = 'block';
        }
        });
    </script>
</body>
</html>
